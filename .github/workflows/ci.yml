name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, sync rules e build do contrato
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + sync:validate + db:build + format:check
      - run: npm run verify

  migrations:
    name: Migrations aplicam e o contrato bate com elas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Esta é a checagem que mais vale a pena do repositório, e não precisa de
    # nenhum segredo: sobe um Postgres limpo, aplica todas as migrations em
    # ordem e regenera os tipos a partir do resultado. Se uma migration quebrou,
    # falha aqui; se alguém alterou o schema e esqueceu de rodar `db:types`, o
    # diff no fim acusa. Sem isso, os dois erros só apareceriam em produção — o
    # primeiro no deploy, o segundo em runtime no app.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      # `db start` aplica supabase/migrations/*.sql em ordem num banco vazio.
      - name: Subir o Postgres local e aplicar as migrations
        run: supabase db start

      # Compara o contrato versionado com o que as migrations produzem,
      # ignorando formatação e o bloco `__InternalSupabase` — que carrega a
      # versão do PostgREST do servidor, diferente entre este Postgres efêmero e
      # o projeto remoto. Sem essa normalização o passo falha em todo push e
      # vira ruído que se aprende a ignorar.
      - name: O contrato versionado está atualizado?
        run: npm run db:types:check:local

      - name: Lint do schema
        run: supabase db lint --local --schema public --fail-on warning
